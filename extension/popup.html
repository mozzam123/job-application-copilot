<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Job Application Copilot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 400px;
      padding: 18px;
      margin: 0;
      background: #ffffff;
      color: #111111;
    }

    h2 {
      margin: 0 0 18px;
      font-size: 19px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      padding: 10px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      resize: vertical;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
    }

    textarea:focus {
      outline: 2px solid #111111;
      outline-offset: 1px;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    #generateBtn {
      background: #111111;
      color: white;
    }

    #generateBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #copyBtn {
      background: #eeeeee;
      color: #111111;
      display: none;
    }

    #status {
      margin-top: 12px;
      font-size: 13px;
      color: #555555;
    }

    #answerContainer {
      display: none;
      margin-top: 18px;
    }

    #answerLabel {
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 600;
    }

    #answer {
      padding: 12px;
      background: #f6f6f6;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <h2>Job Application Copilot</h2>

  <label for="question">
    Application Question
  </label>

  <textarea
    id="question"
    placeholder="What interests you about working for this company?"
  ></textarea>

  <button id="generateBtn">
    Generate Answer
  </button>

  <div id="status"></div>

  <div id="answerContainer">

    <div id="answerLabel">
      Generated Answer
    </div>

    <div id="answer"></div>

    <button id="copyBtn">
      Copy Answer
    </button>

  </div>

  <script src="popup.js"></script>

</body>
</html>
